<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>26-2 K-PACE 생활지도</title>
<meta name="apple-mobile-web-app-title" content="K-PACE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fae'/%3E%3Crect x='12' y='12' width='18' height='18' rx='4' fill='%23fff'/%3E%3Crect x='34' y='12' width='18' height='18' rx='4' fill='%23fff' opacity='.7'/%3E%3Crect x='12' y='34' width='18' height='18' rx='4' fill='%23fff' opacity='.7'/%3E%3Crect x='34' y='34' width='18' height='18' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15202e; --muted:#5b6778; --line:#dde2ea;
  --accent:#1f5fae; --sheet:#18794e; --cafe:#b4521c; --danger:#b42318; --danger-soft:#fdecea;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-display:"Gothic A1","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#18202b; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3543;
  --accent:#6ea6ee; --sheet:#5cc493; --cafe:#f0975e; --danger:#f2867a; --danger-soft:#3a1e1c;
  color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
.brand small{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.brand h1{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:8px;list-style:none;background:var(--line);border-radius:18px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid li{min-width:0}
.tile{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06);transition:transform .12s ease,border-color .12s ease}
a.tile:active{transform:scale(.97)}
a.tile:hover{border-color:var(--accent)}
a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.t-name{display:block;font-weight:700;font-size:18px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.t-sub{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.k-sheet .t-sub{color:var(--sheet)} .k-cafe .t-sub{color:var(--cafe)} .k-link .t-sub{color:var(--accent)}
.arrow{align-self:flex-end;color:var(--muted);font-size:20px}
.k-none{background:transparent;border-style:dashed}
.k-none .t-name{color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.warn{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><small>업무 파일 바로가기</small><h1>26-2 <b>K-PACE</b> 생활지도</h1></header>
  <div id="warn" class="warn" hidden></div>
  <ul class="grid" id="grid"></ul>
  <p class="note" id="foot">버튼을 누르면 해당 파일이 새 창으로 열립니다.</p>
</div>
<script>
/* ===== 여기만 고치면 됩니다 =====
   구글 시트 [파일 → 공유 → 웹에 게시 → CSV] 로 받은 주소를 따옴표 안에 붙여넣으세요.
   비워두면 아래 기본 목록이 보입니다. */
var SHEET_CSV_URL = "";

/* 시트를 못 읽을 때 보여줄 기본 목록 */
var DEFAULT_ITEMS = [
  {name:"재학생 명단", url:"", note:""},
  {name:"상·벌점 현황", url:"", note:""},
  {name:"단체외박 현황", url:"https://docs.google.com/spreadsheets/d/1DLkplXC0MJABgZeyggcvMv7dZJNhTbI4Qr4ZKVX_gWM/edit?gid=0#gid=0", note:""},
  {name:"외출·외박 명단 현황", url:"https://docs.google.com/spreadsheets/d/1ukQ7xyU9IqnEAgfI85r35wnW8wOiU9YOG7Sx0H4YI-0/edit", note:""},
  {name:"초과근무 작성 현황", url:"https://docs.google.com/spreadsheets/d/1493Ip7JGWG79Yi6REgalq3iPAcQhsmEFwfRba0I0eQ8/edit", note:""},
  {name:"카페", url:"https://cafe.daum.net/K-PACE", note:""}
];
/* ================================ */

(function(){
  var grid = document.getElementById('grid'), warn = document.getElementById('warn');
  var CACHE = 'kpace-links-v1';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function kind(url){
    if(!url) return {k:'none', label:'주소 준비 중'};
    try{ var u = new URL(url), h = u.hostname;
      if(h.indexOf('docs.google.com')>-1 && u.pathname.indexOf('/spreadsheets')===0) return {k:'sheet', label:'구글 시트'};
      if(h.indexOf('docs.google.com')>-1) return {k:'link', label:'구글 문서'};
      if(h.indexOf('drive.google.com')>-1) return {k:'link', label:'구글 드라이브'};
      if(h.indexOf('cafe.naver.com')>-1) return {k:'cafe', label:'네이버 카페'};
      if(h.indexOf('cafe.daum.net')>-1) return {k:'cafe', label:'다음 카페'};
      return {k:'link', label:h.replace(/^www\./,'')};
    }catch(e){ return {k:'none', label:'주소 확인 필요'}; }
  }
  function render(items){
    grid.innerHTML = items.map(function(it){
      var k = kind(it.url), sub = it.note || k.label;
      var inner = '<span><span class="t-name">'+esc(it.name)+'</span><span class="t-sub">'+esc(sub)+'</span></span>';
      if(k.k==='none' || !/^https?:\/\//i.test(it.url||'')) return '<li><div class="tile k-none">'+inner+'</div></li>';
      return '<li><a class="tile k-'+k.k+'" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+inner+'<span class="arrow" aria-hidden="true">›</span></a></li>';
    }).join('');
  }
  /* CSV 읽기 (따옴표, 쉼표 포함 칸 처리) */
  function parseCSV(text){
    var rows=[], row=[], cell='', q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c;
    }
    if(cell!==''||row.length){ row.push(cell); rows.push(row); }
    return rows;
  }
  function toItems(rows){
    if(!rows.length) return [];
    var head = rows[0].map(function(h){return h.trim();});
    var iN = head.indexOf('이름'), iU = head.indexOf('주소'), iD = head.indexOf('설명');
    if(iN<0){ iN=0; iU=1; iD=2; }
    return rows.slice(1).map(function(r){
      return {name:(r[iN]||'').trim(), url:(r[iU]||'').trim(), note:iD>-1?(r[iD]||'').trim():''};
    }).filter(function(x){return x.name;});
  }
  function readCache(){ try{ var s=localStorage.getItem(CACHE); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function writeCache(items){ try{ localStorage.setItem(CACHE, JSON.stringify(items)); }catch(e){} }

  render(readCache() || DEFAULT_ITEMS);
  if(!SHEET_CSV_URL) return;

  var url = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?')>-1?'&':'?') + 't=' + Date.now();
  fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(t){
    var items = toItems(parseCSV(t));
    if(!items.length) throw new Error('empty');
    render(items); writeCache(items); warn.hidden = true;
  }).catch(function(){
    warn.textContent = '최신 목록을 불러오지 못해 마지막으로 저장된 목록을 보여줍니다. 인터넷 연결을 확인해 주세요.';
    warn.hidden = false;
  });
})();
</script>
</body>
</html>
